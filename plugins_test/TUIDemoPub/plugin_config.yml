description: TUI smoke demo — publishes events on demand for the Live-stream tab + carries tagged endpoints for the tag-search demo.
version: 0.2.2
remote: false
verbose_notifier: true
arguments:

events:
  greeted:
    topic: "demo.greeted"
    hosts: "any"
  ticked:
    topic: "demo.ticked"
    hosts: "any"
  disabled_demo:
    topic: "demo.disabled"
    hosts: "any"
    enabled: false
  # 1:1 ask target. request_event on this topic is answered by the local
  # subscriber TUIDemoOrch.handle_ask. Drives Beat 2 + Beat 3.
  ask:
    topic: "demo.ask"
    hosts: "any"

endpoints:
  fire_events:
    internal_name: fire_events
    remote: false
    accessible_by_other_plugins: true
    description: Publish a small burst of demo events into Live-stream
    tags: ["demo", "fire"]
    arguments: []

  beat2_ask:
    internal_name: beat2_ask
    remote: false
    accessible_by_other_plugins: true
    description: "Presentation Beat 2: 1:1 request_event answered by a local subscriber"
    tags: ["demo", "beat", "ask"]
    arguments: []

  beat3_flood:
    internal_name: beat3_flood
    remote: false
    accessible_by_other_plugins: true
    description: "Presentation Beat 3: flood the 1:1 ask endpoint to trip its rate limit"
    tags: ["demo", "beat", "flood"]
    arguments:
      - name: n
        type: int
        description: How many request_events to fire back to back (default 20)

  ping:
    internal_name: ping
    remote: false
    accessible_by_other_plugins: true
    description: Returns pong — used to demo a tagged endpoint
    tags: ["demo", "ping"]
    arguments: []

  echo:
    internal_name: echo
    remote: false
    accessible_by_other_plugins: true
    description: Echoes the supplied message back
    tags: ["demo"]
    arguments:
      - name: message
        type: str
        description: The message to echo

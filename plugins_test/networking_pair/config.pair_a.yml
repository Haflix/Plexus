# Pair-harness node A (asker). Hostname "pair-a" is the LOWER of the pair, so
# it is the tiebreak initiator of the advert exchange (the exact spot B-082
# deadlocks). keys_dir / peer / port are injected at runtime by pair_node.py.
plugins:
  - name: PairProbe
    enabled: true
    path: ./plugins_test/networking_pair/PairProbe

general:
    hostname: "pair-a"
    plugin_package: plugins_test
    console_log_level: "WARNING"
    file_log_level: "DEBUG"
    asyncio_debug: false
    logger_levels:
        asyncio: "MUTE"
        urllib3: "MUTE"

networking:
    enabled: true
    port: 0
    discover_nodes: true
    direct_discoverable: true
    auto_discoverable: true

# Wave-2 cooperative harness — DRIVER node (hostname w2a-driver, the lex-lowest
# so it is the election dialer to its peers). Runs Wave2Driver (the cell driver),
# NetObsProbe (records its own _core/* events + snapshot), NetCtl (runtime
# add/remove_peer + sub toggle + reload), and NetFixTarget (a local service so
# TG-03 has a local sub + TG-08 can be called back). port/keys/peers/knobs are
# injected at runtime by wave2_node.py.
plugins:
  - name: NetFixTarget
    enabled: true
    path: ./plugins_test/NetFixTarget
  - name: NetObsProbe
    enabled: true
    path: ./plugins_test/NetObsProbe
  - name: NetCtl
    enabled: true
    path: ./plugins_test/NetCtl
  - name: Wave2Driver
    enabled: true
    path: ./plugins_test/networking_wave2/Wave2Driver

general:
    hostname: "w2a-driver"
    plugin_package: plugins_test
    console_log_level: "WARNING"
    file_log_level: "DEBUG"
    asyncio_debug: false
    logger_levels:
        asyncio: "MUTE"
        urllib3: "MUTE"

networking:
    enabled: true
    port: 0

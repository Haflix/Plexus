description: Structured ports of the 2026-06-21 audit-bug regression guards (networking / events / decorators) that previously lived only in the gitignored audit_2026_06 pytest dir
version: 0.3.1
remote: false
arguments:
dependencies:
endpoints:
  run:
    internal_name: run
    remote: false
    accessible_by_other_plugins: true
    description: Run audit-port unit cases and return a suite result dict
    arguments:
      - name: category
        description: 'decorators | networking | events | null (all)'
      - name: host
        description: 'local | remote | null (all hosts)'
      - name: case_ids
        description: Filter cases within the suite
      - name: bug_ids
        description: Filter cases by bug tag
      - name: skip_slow
        description: Skip cases tagged slow
      - name: allow_destructive
        description: If False, destructive cases are skipped

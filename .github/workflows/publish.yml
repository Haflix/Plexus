name: Publish to PyPI

# Publishes plexus-core to PyPI via Trusted Publishing (OIDC). No API token is
# stored anywhere: PyPI verifies the workflow's identity directly, scoped to
# this repository and this filename. Renaming this file breaks publishing until
# the trusted-publisher entry on PyPI is updated to match.
#
# Triggered by pushing a version tag, e.g.:
#     git tag v0.81.1 && git push origin v0.81.1
# The tag is only a trigger; the version that actually ships is read from
# plexus/__init__.py __version__ by the build backend.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Validate metadata
        run: python -m twine check dist/*

      - name: Show what will be published
        run: ls -l dist/

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # id-token is what lets PyPI verify this workflow without a stored secret.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
